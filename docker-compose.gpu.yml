version: '3.8'

services:
  genocr-api-gpu:
    build:
      context: .
      dockerfile: api_server/Dockerfile.gpu
    image: genocr-api-gpu:latest
    container_name: genocr-api-server-gpu
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models:ro
      - ./uploads:/app/uploads
    environment:
      - MODELS_DIR=/app/models
      - LOG_LEVEL=INFO
      - CUDA_VISIBLE_DEVICES=0
    restart: unless-stopped
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - genocr-network

networks:
  genocr-network:
    driver: bridge
