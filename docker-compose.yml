version: '3.8'

services:
  genocr-api:
    build:
      context: .
      dockerfile: api_server/Dockerfile
    image: genocr-api:latest
    container_name: genocr-api-server
    ports:
      - "8080:8080"
    volumes:
      # Mount models at correct location
      - ./models:/app/models:ro
      # Mount uploads directory
      - ./uploads:/app/api_server/build/uploads
    environment:
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - genocr-network
    deploy:
      resources:
        limits:
          cpus: '15'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4.5G

networks:
  genocr-network:
    driver: bridge
